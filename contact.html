<html lang="en">

<body>

<div class="main">
<style>
.pagehead {
    font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', serif;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: 1px;
    font-size: 300%;
    line-height: 1.1;
    margin: 8px 0px 20px;
}
.panel {
    border: 1px solid #b35a5a;
    border-radius: 6px;
    padding: 24px 26px;
    margin-bottom: 24px;
}
.content {
    padding-top: 22px;
    padding-bottom: 160px;
}
.lead {
    font-size: 0.98em;
    line-height: 1.6;
    max-width: 620px;
    margin-bottom: 24px;
}
form.contact {
    display: grid;
    gap: 16px;
    max-width: 580px;
}
form.contact label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.9em;
    color: #e6cccc;
    letter-spacing: 0.3px;
}
form.contact input,
form.contact select,
form.contact textarea {
    width: 100%;
    box-sizing: border-box;
    background-color: #111111;
    color: #ffffff;
    border: 1px solid #b35a5a;
    border-radius: 4px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.95em;
}
form.contact textarea {
    min-height: 140px;
    resize: vertical;
}
form.contact input:focus,
form.contact select:focus,
form.contact textarea:focus {
    outline: none;
    border-color: #e08a8a;
    box-shadow: 0 0 0 2px rgba(179, 90, 90, 0.3);
}
form.contact .row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
}
form.contact .row > div {
    flex: 1 1 200px;
}
form.contact button {
    justify-self: start;
    background-color: #b35a5a;
    color: #ffffff;
    border: none;
    border-radius: 4px;
    padding: 12px 28px;
    font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', serif;
    font-weight: bold;
    font-size: 1em;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}
form.contact button:hover {
    background-color: #c56a6a;
}
.form-note {
    font-size: 0.82em;
    color: #9a9a9a;
    margin-top: -4px;
}
.social {
    display: flex;
    gap: 16px;
    align-items: center;
    margin: 0 0 26px;
}
.social a {
    display: inline-flex;
    width: 46px;
    height: 46px;
    align-items: center;
    justify-content: center;
    border: 1px solid #b35a5a;
    border-radius: 8px;
    transition: background-color 0.15s ease;
}
.social a:hover { background-color: rgba(179, 90, 90, 0.22); }
.social img { width: 24px; height: 24px; display: block; }
</style>
<div class="content">
<div class="pagehead">Contact</div>
<div class="social">
<a href="https://github.com/Squ1shification" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub"><img src="assets/social/github.png" alt="GitHub" width="24" height="24"></a>
<a href="https://www.linkedin.com/in/wencheng-xue-5aa52631b/" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn"><img src="assets/social/linkedin.png" alt="LinkedIn" width="24" height="24"></a>
</div>
<div class="panel">
<form class="contact" action="#" method="post">
<div class="row">
<div>
<label for="name">Name</label>
<input type="text" id="name" name="name" placeholder="Your name" required>
</div>
<div>
<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="you@example.com" required>
</div>
</div>
<div>
<label for="message">Message</label>
<textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
</div>
<button type="submit">Send message</button>
</form>
</div>
</div>
</div>
</body></html>
